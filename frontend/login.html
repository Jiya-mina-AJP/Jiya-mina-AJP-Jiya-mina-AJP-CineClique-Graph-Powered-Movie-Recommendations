<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CineClique</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-color);
            margin: 0;
            font-family: 'Space Mono', monospace;
            color: var(--text-primary);
        }

        .login-container {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: var(--shadow-md);
        }

        .login-container h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: 3rem;
            font-weight: normal;
            margin: 0 0 8px 0;
            letter-spacing: 2px;
            color: var(--text-secondary);
        }

        .login-container p {
            color: var(--text-secondary);
            margin: 0 0 32px 0;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        .input-group label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .forgot-link {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 12px;
            transition: opacity 0.2s;
        }
        
        .forgot-link:hover {
            opacity: 0.8;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 2px solid var(--border-color);
            background: var(--panel-bg);
            color: var(--text-primary);
            outline: none;
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
        }
        
        .eye-icon {
            position: absolute;
            right: 16px;
            top: 40px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.2s;
        }
        
        .eye-icon:hover {
            color: var(--accent-color);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-md);
            border: none;
            background: var(--accent-gradient);
            color: #121212;
            cursor: pointer;
            font-family: 'Bebas Neue', cursive;
            font-size: 20px;
            letter-spacing: 2px;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-secondary);
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }

        .google-btn {
            width: 100%;
            padding: 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--panel-bg);
            color: var(--text-primary);
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .google-btn:hover {
            background: var(--hover-bg);
        }

        .google-btn img {
            width: 18px;
            height: 18px;
        }

        .footer-link {
            margin-top: 32px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .footer-link a {
            color: var(--accent-color);
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .footer-link a:hover {
            opacity: 0.8;
        }

        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }
        
        .success-message {
            color: #10b981;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1 id="form-title">Welcome back</h1>
        <p id="form-subtitle">Sign in to your account</p>

        <form id="login-form">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
            </div>
            
            <div class="input-group">
                <label for="password">
                    Password
                    <a href="#" class="forgot-link" id="forgot-pw">Forgot password?</a>
                </label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                <svg class="eye-icon" id="toggle-pw" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </div>
            
            <button type="submit" class="login-btn" id="submit-btn">Sign in</button>
            <div id="error-msg" class="error-message"></div>
            <div id="success-msg" class="success-message"></div>
        </form>

        <div class="footer-link">
            <span id="toggle-text">No account?</span> <a id="toggle-mode">Create one</a>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
